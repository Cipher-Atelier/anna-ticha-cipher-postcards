name: Verify saved evidence

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numerical fixture dependency
        run: |
          python3 -m pip install --only-binary=:all: numpy==2.2.6 Pillow==11.3.0
      - name: Run regressions and offline verification at the checked-out SHA
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s verification/tests -v
          python3 research-updates/2026-10-13-executed-rebuild257258/run_fixture_tests.py
          python3 -m unittest discover -s research-updates/2026-10-13-native-source257-annotation/code -v
          python3 -m unittest discover -s research-updates/2026-10-13-source257-fullcard-map/code -v
          python3 research-updates/2026-10-13-source257-fullcard-map/code/fullmap_checks.py research-updates/2026-10-13-source257-fullcard-map/data/fullcard-map-v2.json research-updates/2026-10-13-native-source257-annotation/data/reconciled-native-annotation-v1.json --groups research-updates/2026-10-13-source257-fullcard-map/data/visual-repeat-groups-v2.json /tmp/source257-fullmap-ci-result.json
          python3 -m unittest discover -s research-updates/2026-10-13-source257-class-candidates/code -v
          python3 research-updates/2026-10-13-source257-class-candidates/code/check_candidate_inventory.py research-updates/2026-10-13-source257-class-candidates/data/candidate-inventory-v1.json research-updates/2026-10-13-source257-fullcard-map/data/fullcard-map-v2.json /tmp/source257-class-candidate-ci-result.json --pair-screen research-updates/2026-10-13-source257-class-candidates/data/complete-pair-screen.csv
          python3 -m unittest discover -s research-updates/2026-10-13-source257-exclusion-refinement/code -v
          CONTEXT_DIAGNOSTIC_DIR=$(mktemp -d /tmp/source257-context-refinement-ci.XXXXXX)
          python3 research-updates/2026-10-13-source257-exclusion-refinement/code/check_context_refinement.py research-updates/2026-10-13-source257-exclusion-refinement/data/context-refinement-delta-v2.json research-updates/2026-10-13-source257-class-candidates/data/candidate-inventory-v1.json research-updates/2026-10-13-source257-exclusion-refinement/data/neighbor-ownership-assessment-protocol-v1.json "$CONTEXT_DIAGNOSTIC_DIR/result.json" --context-index research-updates/2026-10-13-source257-exclusion-refinement/data/context-index-v1.json
          python3 -m unittest discover -s research-updates/2026-10-14-source257-repeat-sequence/code -v
          python3 research-updates/2026-10-14-source257-repeat-sequence/code/check_canonical_repeat_evidence.py research-updates/2026-10-14-source257-repeat-sequence/data/canonical-repeat-evidence-v1.json --public-repository-root . --public-data-directory research-updates/2026-10-14-source257-repeat-sequence/data --final-core research-updates/2026-10-14-source257-repeat-sequence/data/repeat-final-ai-review-v2.json --final-core-sha256 25dae066532e513ffc25d9f9db838915f5836177241d610aafbdcd00e661d8dd --final-closure research-updates/2026-10-14-source257-repeat-sequence/data/repeat-closure-final-ai-review-v2.json --final-closure-sha256 1ce734f238a5e9dd88db22205fea108cc53c7f19f4cc10d7bfd2cf5f8e37072e --sequence-tsv research-updates/2026-10-14-source257-repeat-sequence/data/spatial-reference-sequence-v1.tsv
          python3 verification/check_all.py
          if [ -z "$CHECK_BASE" ] || [ "$CHECK_BASE" = 0000000000000000000000000000000000000000 ]; then
            CHECK_BASE=$(git merge-base origin/main HEAD)
          fi
          git diff --check "$CHECK_BASE" "$GITHUB_SHA"
